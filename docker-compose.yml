services:
  panwatch:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_SCREENSHOT: ${INSTALL_SCREENSHOT:-false}
        INSTALL_TRADINGAGENTS: ${INSTALL_TRADINGAGENTS:-false}
    container_name: pricedog-panwatch
    ports:
      - "${PANWATCH_PORT:-18000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      DATABASE_URL: ${PANWATCH_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/pricedog}
      DOCKER: "1"
      PLAYWRIGHT_SKIP_BROWSER_INSTALL: ${PLAYWRIGHT_SKIP_BROWSER_INSTALL:-1}
      PRICE_ACTION_ENGINE_URL: http://price-action-engine:8001
    volumes:
      - pricedog-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      price-action-engine:
        condition: service_healthy
    restart: unless-stopped

  price-action-engine:
    build:
      context: .
      dockerfile: price-action-engine/Dockerfile
    container_name: pricedog-engine
    ports:
      - "8001:8001"
    environment:
      PA_ENGINE_PORT: "8001"
      DATABASE_URL: ${PA_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/pricedog}
      AKSHARE_ADAPTER_URL: http://akshare-adapter:8002
      PA_CRYPTO_WS_ENABLED: ${PA_CRYPTO_WS_ENABLED:-true}
      PA_CRYPTO_WS_SYMBOLS: ${PA_CRYPTO_WS_SYMBOLS:-BTCUSDT,ETHUSDT}
      PA_CRYPTO_WS_INTERVALS: ${PA_CRYPTO_WS_INTERVALS:-5m,1h,4h}
      RUST_LOG: info
    depends_on:
      akshare-adapter:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  akshare-adapter:
    build:
      context: .
      dockerfile: akshare-adapter/Dockerfile
    container_name: pricedog-akshare-adapter
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pricedog}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pricedog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pricedog-data:
  postgres-data:
